name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      # 署名鍵はリポジトリに入れない。Secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD) があれば release 鍵で署名する
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/giracle-native.p12
          printf 'storeFile=keystore/giracle-native.p12\nstorePassword=%s\nkeyAlias=giracle\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: giracle-native-apk
          path: app/build/outputs/apk/release/*.apk
