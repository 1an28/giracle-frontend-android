name: build

on:
  # PR のブランチは pull_request で走るので、push は main だけにする (同じコミットで 2 回走らせない。#31)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # 依存ライブラリと Gradle の取得を前回の実行から使い回し、待ち時間を減らす (#31)
          cache: gradle
      # ランナーに入っている Android SDK を使う。足りないものだけ入れる
      # (android-actions/setup-android は廃止済みの "tools" を入れようとして失敗するため使わない)
      - name: Install SDK packages
        run: .github/scripts/sdk-install.sh
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: giracle-native-apk
          path: app/build/outputs/apk/release/*.apk
