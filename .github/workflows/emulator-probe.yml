name: emulator-probe

# 一時的: GitHub の Linux ランナーでエミュレータが KVM 付きで動くかを確かめる (#12)。結果を記録したら消す。
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/emulator-probe.yml", ".github/scripts/emulator-start.sh"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Runner info
        run: |
          nproc; free -h; df -h /; ls -l /dev/kvm || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
      - name: Start emulator
        run: .github/scripts/emulator-start.sh
      - name: Check
        run: |
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.cpu.abi
          adb shell cmd package list packages | wc -l
