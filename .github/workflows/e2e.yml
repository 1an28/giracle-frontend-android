name: e2e

# 配布版 (R8 適用後) の APK をエミュレータに入れ、ランナー上のサーバーにつないで外から操作して確かめる (#12)。
# 実行するタイミングは D-018 を参照。
on:
  # 文書だけの変更では走らせない (アプリに影響しないため。D-024)
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "releases/notes/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "releases/notes/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Android 15 (API 35) と、targetSdk と同じ Android 17 (API 37。ローカルネットワーク権限などの動作変更がある。#42)
    strategy:
      fail-fast: false
      matrix:
        api: ["35", "37.0"]
    name: e2e (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # 依存ライブラリと Gradle の取得を前回の実行から使い回し、待ち時間を減らす (#31)
          cache: gradle
      - name: Install SDK packages
        run: .github/scripts/sdk-install.sh
      # エミュレータの取得と起動を裏で始め、APK のビルドと重ねる (#85)。終わりは下の Wait for emulator で待つ
      - name: Start emulator (in background)
        env:
          API: ${{ matrix.api }}
        run: |
          ( rc=0; PHASE=launch .github/scripts/emulator-start.sh || rc=$?; echo $rc > ~/emulator-launch.rc ) \
            > ~/emulator-launch.log 2>&1 &
      # 配布版は debug 鍵で署名する (R8 の処理は本物の配布版と同じ。鍵は Secrets を使わない)
      - name: Build release APK and e2e APK
        run: ./gradlew :app:assembleRelease :e2e:assembleDebug
      - uses: ./.github/actions/local-server
      - name: Wait for emulator
        timeout-minutes: 15
        env:
          API: ${{ matrix.api }}
        run: |
          t0=$(date +%s)
          until [ -f ~/emulator-launch.rc ]; do sleep 1; done
          echo "起動を始める処理の終わりを待った時間: $(( $(date +%s) - t0 ))s"
          cat ~/emulator-launch.log
          [ "$(cat ~/emulator-launch.rc)" = 0 ] || { echo "::error::エミュレータの起動を始められなかった"; exit 1; }
          PHASE=wait .github/scripts/emulator-start.sh
          echo "この手順で待った時間: $(( $(date +%s) - t0 ))s"
      - name: Run e2e
        timeout-minutes: 15
        run: .github/scripts/e2e-run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-api${{ matrix.api }}
          path: |
            e2e-out/
            app/build/outputs/mapping/release/mapping.txt
      - name: Logs
        if: failure()
        run: tail -n 60 ~/backend.log ~/web.log ~/emulator-launch.log ~/emulator.log || true
