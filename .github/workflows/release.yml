name: release

# v0.1.0 のようなタグを push すると、GitHub のリリースを作って APK を添付する。
# タグを push できない場合は、Actions 画面からこのワークフローを手動実行してもよい
# (実行したブランチの最新コミットにタグを付けてリリースする)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ (例: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      # タグの push ならそのタグを、手動実行なら実行したブランチの最新を使う
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install SDK packages
        run: .github/scripts/sdk-install.sh

      - name: Check version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::タグ ($TAG) と app/build.gradle.kts の versionName (v$VERSION) が一致しません"; exit 1
          fi

      # 起動を速くする Baseline Profile を、エミュレータで実際に操作して記録し直す (#8、D-021)。
      # 失敗しても、リポジトリにある Baseline Profile のままリリースする (記録はリリースを止めない)
      - name: Build APKs for recording the Baseline Profile
        id: bpbuild
        continue-on-error: true
        run: ./gradlew :app:assembleNonMinifiedRelease :baselineprofile:assembleDebug
      - uses: ./.github/actions/local-server
        if: steps.bpbuild.outcome == 'success'
        continue-on-error: true
      - name: Record Baseline Profile
        if: steps.bpbuild.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          .github/scripts/emulator-start.sh
          .github/scripts/baseline-profile.sh generate app/build/outputs/apk/nonMinifiedRelease/app-nonMinifiedRelease.apk \
            || git checkout app/src/main/baseline-prof.txt

      # 署名鍵が Secrets にあれば CI でビルド・署名する。無ければ、リポジトリに置いた署名済み APK を使う
      - name: Build signed APK (Secrets)
        id: ci
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/giracle-native.p12
          printf 'storeFile=keystore/giracle-native.p12\nstorePassword=%s\nkeyAlias=giracle\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          ./gradlew :app:assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/giracle-native-$TAG.apk"
          rm -f keystore.properties keystore/giracle-native.p12
          echo "built=1" >> "$GITHUB_OUTPUT"
      - name: Use prebuilt APK
        if: steps.ci.outputs.built != '1'
        run: |
          SRC="releases/giracle-native-$TAG.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD) が無く、$SRC もありません"; exit 1
          fi
          mkdir -p out && cp "$SRC" out/

      # 前の版に上書きインストールできるよう、決まった鍵で署名されていることを確かめる
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          EXPECTED=$(tr -d '[:space:]' < releases/SIGNING_CERT_SHA256)
          echo "certificate: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::署名の証明書が登録済みのもの ($EXPECTED) と違います"; exit 1
          fi
          (cd out && sha256sum *.apk > SHA256SUMS.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases/notes/<タグ>.md があれば、その版の案内として先頭に載せる
          EXTRA=""
          if [ -f "releases/notes/$TAG.md" ]; then EXTRA="$(cat "releases/notes/$TAG.md")

          "; fi
          NOTES="${EXTRA}Android 8.0 以上。APK をスマホでダウンロードして開くとインストールできます (README の「入れ方」参照)。
          署名証明書 SHA-256: $(cat releases/SIGNING_CERT_SHA256)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            # タグが無ければ、このコミットに付けて作る
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Giracle Native $TAG" --notes "$NOTES"
          fi
