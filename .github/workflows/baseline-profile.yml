name: baseline-profile

# Baseline Profile をエミュレータで記録し、起動時間を「記録前 (ワイルドカード規則) / 記録後 / 事前コンパイルなし」で比べる (#8、D-021)。
# 記録後の APK で、チャンネルのスクロールのフレーム時間も測る (D-046)。
# 記録したものは成果物 baseline-profile に残す。配布版への取り込みは release.yml が行う (main の同じコミットの記録を使う)。
on:
  # main に入ったら記録しておく。リリースは同じコミットの記録があればそれを使い、記録し直さない (#31)
  push:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - "baselineprofile/**"
  pull_request:
    paths:
      - "baselineprofile/**"
      - ".github/scripts/baseline-profile.sh"
      - ".github/workflows/baseline-profile.yml"
  workflow_dispatch:

concurrency:
  group: baseline-profile-${{ github.ref }}
  # 記録には 20 分ほどかかるので、続けて push しても途中の実行を取り消さない (結果を見るため)
  cancel-in-progress: false

jobs:
  baseline-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # 依存ライブラリと Gradle の取得を前回の実行から使い回し、待ち時間を減らす (#31)
          cache: gradle
      - name: Install SDK packages
        run: .github/scripts/sdk-install.sh
      # 比較用に、今の (ワイルドカード規則の) Baseline Profile で配布版を作っておく
      - name: Build APKs
        run: |
          ./gradlew :app:assembleNonMinifiedRelease :app:assembleRelease :baselineprofile:assembleDebug
          mkdir -p apks && cp app/build/outputs/apk/release/app-release.apk apks/before.apk
      - uses: ./.github/actions/local-server
      - name: Start emulator
        timeout-minutes: 15
        run: .github/scripts/emulator-start.sh
      - name: Record Baseline Profile
        timeout-minutes: 20
        run: .github/scripts/baseline-profile.sh generate app/build/outputs/apk/nonMinifiedRelease/app-nonMinifiedRelease.apk
      - name: Build release APK with the recorded profile
        run: |
          ./gradlew :app:assembleRelease && cp app/build/outputs/apk/release/app-release.apk apks/after.apk
          # 配布版の大きさの変化 (記録した Baseline Profile は APK に入る)
          ls -l apks/
      - name: Measure startup (before)
        timeout-minutes: 15
        run: .github/scripts/baseline-profile.sh measure apks/before.apk before
      - name: Measure startup (after)
        timeout-minutes: 15
        run: .github/scripts/baseline-profile.sh measure apks/after.apk after
      # チャンネルのスクロールのフレーム時間 (D-046)。実機の値ではないので、前の実行との比較に使う
      - name: Measure scroll (after)
        timeout-minutes: 15
        run: .github/scripts/baseline-profile.sh scroll apks/after.apk scroll
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profile
          path: |
            app/src/main/baseline-prof.txt
            bp-out/
