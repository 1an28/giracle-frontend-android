name: live-test

# 実サーバーを使うテスト (LiveServerTest / UiScreenshotTest) を、ランナー上に立てたサーバーに対して動かす。
# サーバーは参照先 (giracle-backend / giracle-frontend-solid) の最新版を取ってきて使う (D-016)。
on:
  # PR のブランチは pull_request で走るので、push は main だけにする (同じコミットで 2 回走らせない。#31)
  # 文書だけの変更では走らせない (アプリに影響しないため。D-024)
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "releases/notes/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "releases/notes/**"
      - "**/*.md"
  workflow_dispatch:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # 依存ライブラリと Gradle の取得を前回の実行から使い回し、待ち時間を減らす (#31)
          cache: gradle
      - name: Install SDK packages
        run: .github/scripts/sdk-install.sh
      - uses: ./.github/actions/local-server
      - name: Tests against local server
        env:
          GIRACLE_TEST_SERVER: http://localhost:3333
        run: ./gradlew :app:testDebugUnitTest
      - name: Check live tests were not skipped
        run: |
          set -e
          for c in LiveServerTest UiScreenshotTest; do
            f=app/build/test-results/testDebugUnitTest/TEST-com.giracle.android.$c.xml
            grep -o '<testsuite [^>]*>' "$f"
            grep -q 'skipped="0"' "$f" || { echo "$c にスキップされたテストがある" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/*.png
      - name: Server logs
        if: failure()
        run: tail -n 100 ~/backend.log ~/web.log || true
